<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Resonate – Free Online Music Player</title>
    <meta
      name="description"
      content="Resonate is a free online music player: search songs and music videos, build playlists, follow synced lyrics and pick music by mood."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://spotifyclone128.web.app/" />
    <meta name="theme-color" content="#000000" />
    <meta name="application-name" content="Resonate" />
    <meta name="apple-mobile-web-app-title" content="Resonate" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Resonate" />
    <meta property="og:title" content="Resonate – Free Online Music Player" />
    <meta
      property="og:description"
      content="Search songs and music videos, build playlists, follow synced lyrics and pick music by mood."
    />
    <meta property="og:url" content="https://spotifyclone128.web.app/" />
    <meta property="og:image" content="https://spotifyclone128.web.app/logo512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Resonate – Free Online Music Player" />
    <meta
      name="twitter:description"
      content="Search songs and music videos, build playlists, follow synced lyrics and pick music by mood."
    />
    <meta name="twitter:image" content="https://spotifyclone128.web.app/logo512.png" />

    <link rel="icon" href="%PUBLIC_URL%/spotify.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Resonate",
        "url": "https://spotifyclone128.web.app/",
        "description": "A free online music player with search, music videos, playlists, synced lyrics and mood-based picks.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://spotifyclone128.web.app/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <noscript>
      <h1>Resonate – Free Online Music Player</h1>
      <p>
        Search songs and music videos, build playlists, follow synced lyrics and pick music by mood.
        Please enable JavaScript to use Resonate.
      </p>
    </noscript>
    <div id="root"></div>
  </body>
</html>
